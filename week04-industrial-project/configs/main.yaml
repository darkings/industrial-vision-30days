app:
  name: Multi-Mode Keycap Vision Inspection System
  version: 1.0.0
active_mode: traditional
mode_configs:
  traditional: configs/modes/traditional.yaml
  yolo: configs/modes/yolo.yaml
  ocr: configs/modes/ocr.yaml
  combined: configs/modes/combined.yaml
input:
  source: directory
  image_path: null
  directory_path: inputs/SET_001
  catalog_path: data/catalogs/keycaps.yaml
  product_id: KC_001
  batch_id: BATCH_01
  allowed_extensions:
    - .jpg
    - .jpeg
    - .png
    - .bmp
    - .tif
    - .tiff
camera:
  serial_number: 7A050E5PAK00046
  exposure_us: 1200
  discard_frames: 5
  retry_count: 3
  mvs_install_dir: null
output:
  outputs_dir: outputs/
  reports_dir: reports/
  save_original: true
  save_annotated: true
  save_debug_images: false
logging:
  level: INFO
  directory: logs/
  console: true
  max_bytes: 10485760
  backup_count: 5
